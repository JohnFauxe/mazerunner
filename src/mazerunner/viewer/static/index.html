<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MazeRunner Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>MazeRunner</h1>
  <nav id="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="run" aria-selected="true">Run</button>
    <button role="tab" data-tab="race" aria-selected="false">Race</button>
    <button role="tab" data-tab="traces" aria-selected="false">Traces</button>
    <button role="tab" data-tab="results" aria-selected="false">Results</button>
  </nav>
  <div class="help-wrap">
    <button id="help-btn" aria-expanded="false" aria-controls="help" title="Keyboard shortcuts">? Help</button>
    <div id="help" class="popover" hidden role="dialog" aria-label="Keyboard shortcuts">
      <h3>Keyboard shortcuts</h3>
      <dl>
        <dt><kbd>Space</kbd></dt><dd>play / pause</dd>
        <dt><kbd>&larr;</kbd> <kbd>&rarr;</kbd></dt><dd>step back / forward (hold <kbd>Shift</kbd> for 100)</dd>
        <dt><kbd>[</kbd> <kbd>]</kbd></dt><dd>previous / next phase</dd>
        <dt><kbd>S</kbd></dt><dd>skip generation, go straight to solving</dd>
        <dt><kbd>Enter</kbd> / click</dt><dd>enlarge a race lane (<kbd>Esc</kbd> to close)</dd>
        <dt><kbd>-</kbd> <kbd>+</kbd></dt><dd>slower / faster</dd>
        <dt><kbd>Home</kbd></dt><dd>restart</dd>
        <dt><kbd>End</kbd></dt><dd>jump to end</dd>
        <dt><kbd>?</kbd></dt><dd>toggle this help</dd>
      </dl>
    </div>
  </div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<main>
  <section id="view-run" class="view" role="tabpanel"></section>
  <section id="view-race" class="view" role="tabpanel" hidden></section>
  <section id="view-traces" class="view" role="tabpanel" hidden></section>
  <section id="view-results" class="view" role="tabpanel" hidden></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
