[project]
name = "mazerunner"
version = "0.0.1"
description = "Benchmark harness for maze generation and solving algorithms across square, polar, hex and other topologies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
report = ["matplotlib>=3.8", "polars>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "networkx>=3.2", "hypothesis>=6.100"]

[project.scripts]
mazerunner = "mazerunner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mazerunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
